name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pin to the version the readme says the suite is tested against.
      # Only bats-core itself is needed - test_helper.bash stubs
      # ssh/mosh/scp/hcloud/jq itself rather than depending on the real
      # bats-support/bats-assert/bats-detik/bats-file libraries, so skip
      # installing those.
      - uses: bats-core/bats-action@4.0.0
        with:
          bats-version: "1.13.0"
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: bats test/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships preinstalled on ubuntu-latest runners.
      # The rai-* scripts (and rai-common/rai-config/rai-provider-*, which
      # are sourced rather than executed and so have no shebang) are listed
      # explicitly, since the repo root also has non-script files
      # (readme.md, LICENSE, *.md plans, todo.md) with no extension
      # convention to glob on. test/*.bats is bats syntax, not plain bash,
      # so it's excluded too.
      - run: |
          shellcheck -s bash \
            rai \
            rai-code \
            rai-common \
            rai-config \
            rai-cp \
            rai-mosh \
            rai-provider-hetzner \
            rai-provider-selfhosted \
            rai-pull \
            rai-push \
            rai-ssh \
            rai-start \
            rai-stop \
            rai-unlock
